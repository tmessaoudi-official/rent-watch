name: CI

# Runs the discipline this repo already carries but never enforced automatically: the PHPUnit
# suite, the §1 tenure tripwire's own self-test, the runner-fetch signature check, the config/doc
# drift scan and shell-script syntax — on every push and PR. The
# sabotage ledger (every seeded regression must still be caught) runs nightly and on
# demand rather than on every push, because it re-runs the whole suite once per seeded break.
#
# Runtime, now OBSERVED END TO END rather than extrapolated — and it depends heavily on the PHP
# build. This note previously carried an estimate with the caveat "NOT yet observed end to end,"
# because the ledger had failed 7/7 and never reached case 1. It has since completed:
#   GitHub runner (release build): 22 min 09 s for the whole ledger — run 22, job 96662174348,
#     step "Sabotage ledger" 03:49:57 -> 04:12:06 UTC on 2026-08-21, green, 315 cases at that
#     commit. That is 4.2 s per case including the per-case `cp -a` of src/tests/config/vendor.
#     The 90-minute budget set then had roughly 4x headroom at that case count — and was OUTGROWN
#     by 2026-08-29 (527 cases: 75 min, 87 min, then cut off at 90). See the job's own note.
#   A ZTS DEBUG build (e.g. the dev machine): the suite ALONE is 55 s (1585 tests, measured
#     uncontended 2026-08-22), so a case costs ~60 s and 322 cases is ~5 h 20 m. The two builds
#     differ by ~14x, not the ~7x recorded here earlier — the gap widened as the suite gained
#     interpreter-bound sweeps, which is where a debug build is punished hardest
#     (TextTest::testFoldPreservesByteOffsets walks ~196 000 codepoints and is ~12 s of that 55 s).
#     NEVER read a local ledger timing as the CI cost.
# Two consequences worth stating, because both have already caused a wrong conclusion:
#   - A local ledger run is a ~5-hour job. Run it in a pinned worktree, not the live tree, or the
#     working copy is frozen for the day: every case does a `cp -a` of src/, tests/ and config/.
#   - A ledger that FAILS well inside the budget (run 27 failed in 21 min) has not timed out — it
#     has found something. Do not read a fast red as an infrastructure problem.
#
# Toolchain notes, all forced by this repo (see CLAUDE.md § Gotchas):
#   - PHP is 8.5, no Composer runtime deps. `composer dump-autoload --dev` generates the PSR-4
#     autoloader (the `--dev` is load-bearing: without it the corpus suite errors "Class not found").
#   - The runner is PHPUnit's official PHAR, fetched by tools/fetch-phpunit.sh against a pinned
#     SHA-256 (and a PGP signature when a keyserver is reachable — which it is on a GitHub runner,
#     so CI gets full signature verification). vendor/ and the PHAR are both gitignored.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the sabotage ledger only.
    - cron: '0 3 * * *'

permissions:
  contents: read

# `github.event_name` is part of the group ON PURPOSE. A `schedule` run and a `push` run both
# resolve `github.ref` to refs/heads/master (verified against the Actions API: every scheduled run
# reports head_branch=master, same as every push), so without it they shared one group — and with
# `cancel-in-progress: true`, the next push killed the running nightly. That matters here because
# the ledger runs for tens of minutes (see the runtime note above) and CLAUDE.md § "Git autonomy"
# authorises autonomous pushes to master, so a nightly overlapping any morning push was simply
# cancelled — a second, independent reason it never completed. Splitting by event keeps
# push-cancels-push (what this was for) while letting the nightly run to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: suite + guards
    runs-on: ubuntu-latest
    # The fast gate: everything except the nightly-only sabotage run.
    if: github.event_name != 'schedule'
    # Measured at well under a minute of actual work (the suite itself is 4 s on a runner); this is
    # a hang budget, not a target.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, curl, dom, iconv, pdo_sqlite, sqlite3, openssl
          coverage: none
          tools: composer

      - name: Generate the PSR-4 autoloader (--dev — the corpus suite needs it)
        run: composer dump-autoload --dev --optimize --no-interaction

      - name: Fetch the pinned PHPUnit runner
        run: bash tools/fetch-phpunit.sh

      - name: PHPUnit suite
        run: php tools/phpunit.phar --colors=never

      - name: CI workflow self-test
        run: bash tests/test-ci-workflow.sh

      - name: Tenure §1 tripwire self-test
        run: bash tests/test-tenure-guard.sh

      - name: Vehicle §1 tripwire self-test
        run: bash tests/test-vehicle-guard.sh

      - name: Runner fetch refuses a bad signature
        run: bash tests/test-fetch-phpunit.sh

      # The one line of `.env` loading that PHPUnit cannot reach. `bin/scout` loads the file, not
      # `Scout`, so that the suite — which constructs `Scout` against the real repo root — never
      # pulls a developer's real credentials into a test run. That placement is right and it leaves
      # the call itself uncovered, so this runs the actual executable in a throwaway root.
      - name: .env is parsed, not executed (through the real CLI)
        run: bash tests/test-dotenv-cli.sh

      # A fixture is a file this repo republishes, so the scrubber is a secrets gate and gets the
      # same treatment as the others: a must-strip half, a must-refuse half and a must-stay-quiet
      # half. It exists because "the address is absent" was the wrong test — every Bien'ici link
      # carries a JWT whose payload base64url-decodes to the subscriber's address, so the old check
      # passed while the address was one `base64 -d` away.
      - name: Fixture scrubber refuses a recoverable address
        run: bash tests/test-scrub-eml.sh

      # ITS TWIN, AND WIRING IT HERE IS THE POINT. `dump-eml.php` is the other half of the capture
      # path: the scrubber decides what may be committed, this decides what may be written at all,
      # and it writes RAW — the subscriber's address, usually their name, every per-recipient token.
      # Its "never under tests/" guard used to fail OPEN on the bare `tests` and on any out-dir whose
      # parent did not exist, which was its own DEFAULT out-dir's shape on a fresh tree. A guard test
      # that CI never runs is a guard nobody runs, and shipping one beside a wired twin is exactly
      # the one-of-two-symmetric-surfaces defect this repo keeps paying for.
      - name: Raw capture tool refuses the fixture tree and hides its password
        run: bash tests/test-dump-eml.sh

      # A watcher that is DOWN is worse than one that is stale: a stale watcher still pushes,
      # wrongly, and a stopped one pushes nothing — which is exactly what a quiet market looks like.
      # `docker compose ps` omits a non-running service without `-a`, so a wedged recreate announces
      # itself as a shorter list. The verifier is read-only and its test drives it entirely through a
      # stub `docker`, so this step needs no daemon and no containers.
      - name: Deploy verifier catches a down, stale or wedged watcher
        run: bash tests/test-verify-deploy.sh

      # The seen-set is the one file this project calls UNRECOVERABLE, and the README told operators
      # to back it up without saying how — so `cp` was the implied answer, and a byte copy of a live
      # WAL database is torn while opening without complaint. This proves the tool reads its own copy
      # back, refuses rather than writing an empty one, and that two runs in the same second do not
      # overwrite each other (its own first draft did, and a weak assertion hid it).
      # `sqlite3` is a SYSTEM BINARY and nothing in this repo installs it: composer.json has zero
      # dependencies, the Dockerfile needs only the PHP extension, and the `extensions:` key above
      # names the PHP extension `sqlite3` — a different thing. Two files use the CLI, and both are
      # exercised by the step below. On a rotating `ubuntu-latest` that is a dependency on whatever
      # the runner image happens to ship this month, which is not a dependency, it is a coincidence.
      #
      # `backup-state.sh` already REFUSES loudly when it is missing, so the failure would be
      # readable rather than mysterious — this step is about the build not depending on it at all.
      - name: Ensure the sqlite3 CLI is present (backup-state.sh drives SQLite's online backup API through it)
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          fi
          sqlite3 --version

      - name: State backup produces a copy that reads back
        run: bash tests/test-backup-state.sh

      # BEFORE the scan itself, deliberately. The scan is a gate, and a gate that has been silently
      # disabled reports clean — which is exactly how an earlier version of it printed a P0 and
      # still exited 0. Running the self-test first means a gutted check fails the build instead of
      # waving the build through.
      - name: Sabotage expressions still apply (no case matching nothing)
        # In the FAST job on purpose: a sed that matches nothing reports coverage it does not have,
        # and the nightly ledger is the only other thing that surfaces it — 4.8 hours after the
        # commit that broke it. This takes a second and needs no PHP.
        run: bash tests/test-sabotage-applies.sh

      - name: Sabotage ledger is judged in a GREEN scratch tree (proves the gate is not vacuous)
        # THE GATE THAT CERTIFIED NOTHING. The ledger copies an explicit file list into a scratch tree
        # and judges every case there; `.env.example` was missing from that list from 2026-08-22
        # 20:43 to 2026-08-23 23:31, so one test failed in every scratch run, the `Failures: [1-9]`
        # detection assertion was satisfied unconditionally, and all ~375 cases reported ok while
        # proving nothing. The window was ~27 hours and that is not what makes it serious: nothing
        # in the ledger's own output distinguishes a vacuous run from a real one, so it would have
        # continued indefinitely.
        #
        # In the FAST job, not the nightly, for the same reason as the check above: the nightly is
        # the thing this protects, so learning from the nightly is learning 4.8 hours too late.
        run: bash tests/test-sabotage-baseline.sh

      - name: Drift-scan self-test (proves the gate can still go red)
        run: bash tests/test-drift-scan.sh

      - name: Config/doc drift scan (fails on P0/P1)
        run: bash .claude/skills/scout-repair/drift-scan.sh

      - name: Shell script syntax
        run: |
          find .claude/hooks tests tools \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  sabotage:
    name: sabotage ledger (detection proof)
    runs-on: ubuntu-latest
    # Heavy (75-90+ min on a runner at 527 cases; see the runtime note at the top): re-runs the
    # whole suite once per seeded regression. Nightly + on demand,
    # not per-push — the fast job above catches ordinary breakage on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # An explicit budget, below GitHub's silent 360-minute default so a ledger that HANGS is still a
    # red build the same day. It was 90 from 2026-08-21 (22 min measured, "4x headroom") until the
    # ledger outgrew it: 258 -> 527 cases in ten days, and the nightlies ran 75 min (28 Aug), 87 min
    # (27 Aug) and then 90 min on 29 Aug, where GitHub cut the job off. A budget outgrown is worse
    # than a hang, because it looks like a cancellation and nothing reads a cancellation as a fault.
    # 240 is ~2.5x the last completed run; the floor of 180 is pinned by tests/test-ci-workflow.sh.
    timeout-minutes: 240
    # For the failure notice below. `contents: read` at the top level is otherwise inherited, and a
    # job-level block replaces it wholesale — so `contents` has to be restated for actions/checkout.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, curl, dom, iconv, pdo_sqlite, sqlite3, openssl
          coverage: none
          tools: composer

      - name: Generate the PSR-4 autoloader (--dev)
        run: composer dump-autoload --dev --optimize --no-interaction

      - name: Fetch the pinned PHPUnit runner
        run: bash tools/fetch-phpunit.sh

      - name: Sabotage ledger — every seeded regression must be caught
        # TEE'd, because the alert below has to carry its own evidence. `set -o pipefail` is
        # explicit: GitHub's default shell is `bash -e`, NOT `-o pipefail`, so without it `tee`'s
        # exit status would mask a red ledger and the nightly would go green on a failing gate —
        # the exact class of defect this whole job exists to catch, in the job itself.
        shell: bash
        run: |
          set -o pipefail
          bash tests/sabotage-check.sh 2>&1 | tee "$RUNNER_TEMP/ledger.log"

      # THE LEDGER MUST BE DELIVERED TO SOMEONE. Hard rule 2: "an alert that is computed and never
      # sent is worse than none." This job failed 7/7 from 2026-08-13 to 2026-08-19 — every night,
      # into the void — because a red nightly notifies nobody and nobody thinks to look. The fix for
      # the flag that broke it is worthless if the next breakage is equally invisible.
      #
      # An issue, not a webhook: it needs no secret (the built-in GITHUB_TOKEN suffices), so it works
      # in a public repo with nothing to leak. Reusing one dated issue per failing day keeps a run of
      # bad nights from opening a hundred of them.
      # `|| cancelled()` is load-bearing: a job killed by `timeout-minutes` is recorded as CANCELLED,
      # not as a failure, so on 2026-08-29 the 90-minute cut-off SKIPPED this step and the outgrown
      # budget reached nobody — hard rule 2's shape inside the alerting job itself. Stated cost: a
      # manual cancel now opens a spurious issue, which the green nightly retracts the next day.
      - name: A red ledger must reach a human
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            const title = `sabotage ledger RED (${day})`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            // WHICH CASES FAILED, in the alert itself. Without this the issue named a run whose
            // logs need admin rights to download, so the first question anyone asks — "what
            // broke?" — could not be answered by the person the alert was sent to. That is hard
            // rule 2 one step on: an alert that reaches a human and carries no evidence still
            // leaves them unable to act. Observed on 2026-08-24, when issue #3 arrived and the
            // failing case could only be recovered by re-running the ~5-hour ledger locally.
            //
            // The ledger's own tail is the evidence: it prints `undetected or unapplied:` followed
            // by one line per case, which is precisely the list a reader needs. ANSI colour is
            // stripped, and the block is capped — a ledger with fifty failures is a different
            // problem, and pasting fifty lines into an issue body would bury the summary.
            const fs = require('fs');
            let detail = '';
            try {
              const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/ledger.log`, 'utf8')
                .replace(/\u001b\[[0-9;]*m/g, '');
              const tally = log.match(/^\s*\d+ sabotage\(s\) detected, \d+ undetected$/m);
              const block = log.match(/undetected or unapplied:\n([\s\S]*?)(?:\n\s*\n|$)/);
              const lines = block ? block[1].split('\n').filter((l) => l.trim() !== '') : [];
              const shown = lines.slice(0, 25);
              detail = [
                tally ? tally[0].trim() : '(tally not found — the ledger may have aborted early)',
                ``,
                lines.length > 0 ? '```' : '',
                ...shown,
                lines.length > shown.length ? `    … and ${lines.length - shown.length} more` : '',
                lines.length > 0 ? '```' : '',
              ].filter((l) => l !== '').join('\n');
            } catch (e) {
              // NAMED, not swallowed. A missing log is itself worth knowing: it means the step
              // died before the ledger produced output, which is an infrastructure failure rather
              // than a detection failure, and the two need different responses.
              detail = `(the ledger produced no readable log: ${e.message})`;
            }
            const body = [
              `The nightly sabotage ledger failed on ${day}.`,
              ``,
              `This is the gate that proves the test suite would actually go red if the tenure`,
              `classifier or the store regressed. While it is failing, a green suite means less`,
              `than it claims — see CLAUDE.md "Common workflows".`,
              ``,
              `## What was not caught`,
              ``,
              detail,
              ``,
              `A case listed as \`undetected\` means the suite stayed GREEN while that regression`,
              `was seeded — the guarantee it names has no test behind it. A case listed as`,
              `\`unapplied\` means its sed matched nothing, so it proved nothing either way;`,
              `\`bash tests/test-sabotage-applies.sh\` catches those in a second, on every push.`,
              ``,
              `Reproduce one case without the ~5-hour full run:`,
              "```",
              `SABOTAGE_FILTER='<label>' bash tests/sabotage-check.sh`,
              "```",
              ``,
              `Run: ${url}`,
              `Commit: ${context.sha}`,
            ].join('\n');
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (found.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.items[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
              });
            }

      # AND IT MUST BE RETRACTED WHEN IT STOPS BEING TRUE. The step above raises an alert; nothing
      # ever withdrew one, so a single bad night left the board reading RED through every green night
      # that followed. That is hard rule 2 read from the other end — "an alert that is computed and
      # never sent is worse than none" has a twin: an alert nobody retracts becomes furniture, and
      # the next real red arrives on a board that already says RED. Not hypothetical: issues #1 and
      # #2 stood open for days while the regression they reported had already been fixed and pushed.
      #
      # EVERY open `sabotage ledger RED …` issue, not only today's. The run that finally goes green
      # is precisely the one that should clear the whole backlog; matching on today's date would
      # leave the older ones for a human to close by hand, which is the work this step exists to
      # remove.
      #
      # `listForRepo`, NOT the `search` call the failure path uses. The search index is eventually
      # consistent, so an issue opened minutes earlier (two `workflow_dispatch` runs in a row) can
      # be invisible to it — and an alert that fails to close is the defect being fixed here, so
      # this path must read live state. It returns pull requests as issues, hence the filter.
      - name: A green ledger must retract the alert it raised
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const stale = open.filter(
              (i) => !i.pull_request && i.title.startsWith('sabotage ledger RED'),
            );
            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `The sabotage ledger is green again as of ${context.sha}.\n\nRun: ${url}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
            core.info(`closed ${stale.length} stale ledger issue(s)`);
